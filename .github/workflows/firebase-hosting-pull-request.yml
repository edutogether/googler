# Firebase CLI(firebase init hosting:github)로 자동 생성됨.
# PR을 올리면 실제 라이브(googler.edutogether.kr)와 별개인 임시 미리보기 URL에만
# 배포한다 — main 배포 게이트(firebase-hosting-merge.yml)와는 무관하고 프로덕션에 영향 없음.
#
# 2026-10-05, 보안 스캔 지적(Medium)으로 job을 둘로 갈랐다(Portal PR #8에서 먼저
# 검증한 구조를 그대로 옮김). 예전엔 한 job 안에서 PR 코드를 실행(npm ci·빌드·
# 테스트)한 뒤 같은 job에서 서비스계정 비밀(main 배포와 같은 비밀)로 배포했다 —
# 빌드 단계가 $GITHUB_ENV·$GITHUB_PATH 등으로 뒤 단계를 오염시키면 비밀이 있는
# 단계에서 PR 코드가 실행될 수 있는 구조였다. 지금은:
#   build   — PR 코드를 실행한다. 비밀을 전혀 참조하지 않고 contents: read만 가진다.
#             결과물(dist/)만 artifact로 넘긴다.
#   preview — 비밀을 쓴다. PR 코드를 실행하지 않는다(npm ci·빌드·테스트 없음).
#             firebase.json도 PR 것이 아니라 base(main) 것을 쓴다 — PR이
#             predeploy 훅 같은 것을 firebase.json에 넣을 수 있기 때문이다.
# 동작은 그대로다: 같은 저장소 PR만, 미리보기 주소가 PR에 달린다.

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '_docs/**'
      - '.claude/**'
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run rules:test
      - run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
      - name: 빌드 산출물을 artifact로 올림
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-dist
          path: dist/
          # dist/가 비었는데 조용히 통과하면 빈 미리보기가 배포된다(§21-1).
          if-no-files-found: error
          retention-days: 1

  preview:
    needs: build
    # Dependabot이 연 PR은 미리보기를 건너뛴다 — Dependabot PR에는 저장소 비밀이
    # 전달되지 않아 서비스계정이 비어 매번 실패로 표시됐다. 비밀을 Dependabot에
    # 주는 대신 이 job만 건너뛴다. 누가 다시 실행하든 같도록 실행한 사람(actor)이
    # 아니라 PR 작성자로 판정한다. build(검사)는 그대로 돈다.
    # base가 main인 PR만 배포한다 — 운영 서비스계정을 쓰는 job이라 기준 브랜치를 못 박는다.
    if: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      # PR 것이 아니라 base(main) 것을 받는다 — firebase.json·.firebaserc를 PR이
      # 바꿔서 이 job(비밀이 있는)에서 뭔가 실행시키지 못하게 하려는 것이다.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-dist
          path: dist
      - name: 받은 산출물 확인
        run: |
          if [ ! -s dist/index.html ]; then
            echo "::error::받은 artifact에 dist/index.html이 없거나 비어 있음 — 빈 미리보기를 배포하지 않는다."
            exit 1
          fi
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BE_A_G00GLER }}
          projectId: be-a-g00gler
