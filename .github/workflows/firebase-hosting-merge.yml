name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run rules:test
      - run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BE_A_G00GLER }}
          channelId: live
          projectId: be-a-g00gler
      # continue-on-error keeps a rules/index deploy failure from blocking
      # the Hosting deploy above, which is the part every push actually
      # needs to succeed — never reorder this step before Hosting deploy
      # (see CLAUDE.md, an earlier ordering here silently skipped Hosting
      # deploy entirely on the first real deploy attempt).
      - name: Deploy Firestore rules and indexes
        id: rules_deploy
        continue-on-error: true
        run: |
          trap 'rm -f /tmp/firebase-service-account.json' EXIT
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          npx firebase-tools deploy --only firestore:rules,firestore:indexes --project be-a-g00gler --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BE_A_G00GLER }}
      # continue-on-error hides a rules/index deploy failure from the job's
      # overall pass/fail status, so without this the repo's firestore.rules
      # could silently drift from what's actually live with no signal
      # anywhere. This can't fail the job (that would defeat the point of
      # continue-on-error above) — it just makes the failure impossible to
      # miss in the Actions UI.
      - name: Warn if the Firestore rules/index deploy failed
        if: steps.rules_deploy.outcome == 'failure'
        run: |
          echo "::error::Firestore rules/index deploy failed — firestore.rules in this repo may now be out of sync with what's actually live. Check the 'Deploy Firestore rules and indexes' step above and redeploy manually if needed." | tee -a "$GITHUB_STEP_SUMMARY"
