name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run rules:test
      - run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BE_A_G00GLER }}
          channelId: live
          projectId: be-a-g00gler
      # The service account firebase init hosting:github created only has
      # Hosting-deploy scope, not firebaserules.googleapis.com access, so
      # this 403s until that's granted manually in IAM. continue-on-error
      # keeps that failure from blocking the Hosting deploy above, which is
      # the part every push actually needs to succeed.
      - name: Deploy Firestore rules and indexes
        continue-on-error: true
        run: |
          trap 'rm -f /tmp/firebase-service-account.json' EXIT
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          npx firebase-tools deploy --only firestore:rules,firestore:indexes --project be-a-g00gler --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BE_A_G00GLER }}
