<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages serves this as a static file with no custom HTTP
         headers available, so the CSP has to go here as a meta tag. That
         means frame-ancestors/report-uri/sandbox are left out — browsers
         silently ignore those three when set via meta rather than a real
         header, so including them would just be false reassurance. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://o4511966927912960.ingest.us.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <link
      id="googler-favicon"
      rel="icon"
      type="image/png"
      href="/googler/favicon/gemini-star-active.png?v=20260803-1"
    />
    <link rel="stylesheet" href="/googler/fonts/pretendard/pretendard.css" />
    <meta
      name="description"
      content="호기심을 가이드 삼아 배우고 만들고 성장하는 Be a Googler의 학습 모험"
    />

  <body>
    <!-- Boot splash: painted before any JS runs, so a fresh tab shows the
         brand instead of a white flash; App.tsx fades it out once the first
         frame is ready. Inline styles only — nothing here may depend on the
         app bundle. -->
    <div id="boot-splash" style="align-items:center;background:linear-gradient(160deg,#fffdf6,#e9f4ff);display:flex;flex-direction:column;gap:18px;inset:0;justify-content:center;position:fixed;transition:opacity .4s ease;z-index:9999">
      <div style="color:#202124;font-family:'Pretendard Variable',Pretendard,SUIT,'Noto Sans KR',system-ui,sans-serif;font-size:30px;font-weight:800;letter-spacing:-.02em">Be&nbsp;a&nbsp;<span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">l</span><span style="color:#ea4335">e</span><span style="color:#202124">r</span></div>
      <div style="color:#6b7166;font-family:'Pretendard Variable',Pretendard,SUIT,'Noto Sans KR',system-ui,sans-serif;font-size:14px;font-weight:650">배움이 모험이 되는 곳 ✨</div>
      <div style="background:rgba(47,111,214,.16);border-radius:99px;height:4px;margin-top:4px;overflow:hidden;width:160px"><div style="animation:googler-boot-bar 1.1s ease-in-out infinite;background:linear-gradient(90deg,#2f6fd6,#6fb1ff);border-radius:99px;height:100%;width:40%"></div></div>
      <style>
        @keyframes googler-boot-bar{0%{margin-left:-40%}100%{margin-left:100%}}
        @media (prefers-reduced-motion: reduce){#boot-splash *{animation:none !important}}
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
