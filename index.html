<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      rel="icon"
      type="image/png"

    />
    <meta
      name="description"
      content="호기심을 가이드 삼아 배우고 만들고 성장하는 Be a Googler의 학습 모험"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://edutogether.github.io/googler/" />
    <meta property="og:site_name" content="Be a Googler" />
    <meta property="og:title" content="Be a Googler | 배움의 모험을 하는 곳" />
    <meta
      property="og:description"
      content="호기심을 가이드 삼아 배우고 만들고 성장하는 구글러의 학습 모험"
    />
    <meta
      property="og:image"
      content="https://edutogether.github.io/googler/social/be-a-googler-kakao-thumbnail.png?v=20260803-5"
    />
    <meta
      property="og:image:secure_url"
      content="https://edutogether.github.io/googler/social/be-a-googler-kakao-thumbnail.png?v=20260803-5"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1730" />
    <meta property="og:image:height" content="909" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Be a Googler | 배움의 모험을 하는 곳" />
    <meta
      name="twitter:description"
      content="호기심을 가이드 삼아 배우고 만들고 성장하는 구글러의 학습 모험"
    />
    <meta
      name="twitter:image"
      content="https://edutogether.github.io/googler/social/be-a-googler-kakao-thumbnail.png?v=20260803-5"
    />
    <title>Be a Googler | 배움의 모험을 하는 곳</title>
    <script>
      (() => {
        const activeIcon =
          "/googler/favicon/gemini-star-active.png?v=20260803-1";
        const inactiveIcon =
          "/googler/favicon/gemini-star-inactive.png?v=20260803-1";

        const updateFavicon = () => {
          const favicon = document.getElementById("googler-favicon");
          if (!favicon) return;

          const isActive =
            document.visibilityState === "visible" && document.hasFocus();
          favicon.href = isActive ? activeIcon : inactiveIcon;
        };

        document.addEventListener("visibilitychange", updateFavicon);
        window.addEventListener("focus", updateFavicon);
        window.addEventListener("blur", updateFavicon);

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", updateFavicon, {
            once: true,
          });
        } else {
          updateFavicon();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
