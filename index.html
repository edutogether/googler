<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP is set as a real HTTP header in firebase.json (Firebase Hosting
         supports custom headers, unlike GitHub Pages), so no meta tag here. -->
    <link
      id="googler-favicon"
      rel="icon"
      type="image/png"
      href="/favicon/gemini-star-active.png?v=20260803-1"
    />
    <link rel="stylesheet" href="/fonts/pretendard/pretendard.css" />
    <style>
      /* 부트 스플래시 — 전 앱 표준(_shared/standards/splash-standard.md) 구현.

         **인라인으로 두는 이유**: 외부 스타일시트(번들 포함)로 두면 그 CSS가 렌더를
         막아, 느린 회선에서는 스플래시 자체가 늦게 나타난다 — 이 앱에서 3G급으로
         실측했을 때 82KB 번들 CSS를 기다리느라 6.3초 뒤에야 보였다. 인라인 CSS는
         HTML과 함께 그려지므로 첫 페인트에 나온다(표준 §0의 목적 그 자체다).
         표준이 금지하는 것은 인라인 <script>이고, 스타일은 해당하지 않는다.

         색만 이 앱 값이고 구조·타이밍·레이아웃은 표준 그대로다. --cream(앱 이름
         텍스트 색)은 쓰지 않는다 — 브랜드 이미지에 이름이 이미 들어 있어 .name을
         생략했다(표준 개정 2026-09-09 §2). */
      :root {
        --bg: #fffdf6;
        --bg2: #e9f4ff;
        --muted: #6b7166;
        --gold: #2f6fd6;
        --gold-soft: #6fb1ff;
      }

      /* 사라지는 타이밍을 CSS로 잡는다 — JS 타이머로 시작하면 번들이 로드된 뒤부터
         재는 셈이라 그만큼 늦게 사라진다. CSS 애니메이션은 문서가 그려지는 순간부터
         흐르므로 첫 페인트 기준에 맞는다.
         1800ms 유지 → 500ms 페이드 → 2400ms에 제거. */
      #splash {
        animation: splashOut 2400ms ease forwards;
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(180deg, var(--bg), var(--bg2));
      }
      @keyframes splashOut {
        0%,
        74.99% {
          opacity: 1;
          pointer-events: auto;
        }
        75% {
          opacity: 1;
          pointer-events: none;
        }
        95.83%,
        100% {
          opacity: 0;
          pointer-events: none;
        }
      }

      /* 로드 게이트(표준 개정 2026-09-09 §1): 2400ms가 지나도 page load가 아직이면
         src/splash.ts가 .is-held를 붙여 유지를 연장하고, load가 끝나면 .is-leaving으로
         500ms 페이드 후 제거한다. JS는 시간을 재지 않고 "끝났는가"만 판정한다. */
      #splash.is-held {
        animation: none;
        opacity: 1;
        pointer-events: none;
      }
      #splash.is-leaving {
        animation: splashFade 500ms ease forwards;
        pointer-events: none;
      }
      @keyframes splashFade {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* 로고는 이모지가 아니라 실제 브랜드 이미지다(표준 개정 2026-09-09 §2).
         높이는 원본 해상도(194×38)를 넘겨 늘이지 않는다 — 확대하면 흐려진다. */
      #splash .logo {
        height: 36px;
        width: auto;
        filter: drop-shadow(0 10px 24px rgb(47 111 214 / 0.22));
        animation: splashPop 0.6s ease;
      }
      #splash .stagline {
        color: var(--muted);
        font-family: 'Pretendard Variable', Pretendard, SUIT, 'Noto Sans KR', system-ui, sans-serif;
        font-size: clamp(13px, 2vw, 16px);
        font-weight: 650;
      }
      #splash .sbar {
        display: block;
        width: 190px;
        height: 3px;
        border-radius: 99px;
        background: rgb(47 111 214 / 0.16);
        overflow: hidden;
        margin-top: 4px;
      }
      /* margin이 아니라 transform으로 움직인다 — margin은 매 프레임 레이아웃을
         다시 계산시켜(리플로우) 저사양 기기에서 버벅임의 원인이 된다. */
      #splash .sbar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--gold), var(--gold-soft));
        animation: splashBar 1.15s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes splashPop {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        60% {
          transform: scale(1.08);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes splashBar {
        0% {
          transform: translateX(-76px);
        }
        100% {
          transform: translateX(190px);
        }
      }

      /* 움직임을 줄여달라고 한 사용자에게는 연출을 생략한다. 이 규칙을 앱 번들의
         전역 reduced-motion 규칙에 맡기지 않고 여기 두는 이유: 번들 CSS는 스플래시보다
         늦게 도착할 수 있어, 그 사이 잠깐 애니메이션이 전속으로 돈다. */
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #splash.is-leaving {
          animation-duration: 1ms;
        }
        #splash .logo,
        #splash .sbar i {
          animation: none;
        }
      }
    </style>
    <meta
      name="description"
      content="호기심을 가이드 삼아 배우고 만들고 성장하는 Be a Googler의 학습 모험"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://googler.edutogether.kr/" />
    <meta property="og:site_name" content="Be a Googler" />
    <meta property="og:title" content="Be a Googler | 호기심이 이끄는 대로 !" />
    <meta
      property="og:description"
      content="배우고 만들며 성장하는 구글러의 학습 모험을 떠나요 🔍🚀"
    />
    <meta
      property="og:image"
      content="https://googler.edutogether.kr/og.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://googler.edutogether.kr/og.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Be a Googler | 호기심이 이끄는 대로 !" />
    <meta
      name="twitter:description"
      content="배우고 만들며 성장하는 구글러의 학습 모험을 떠나요 🔍🚀"
    />
    <meta
      name="twitter:image"
      content="https://googler.edutogether.kr/og.jpg"
    />
    <title>Be a Googler</title>
    <script src="/favicon-toggle.js" defer></script>
  </head>
  <body>
    <!-- 스플래시는 정적 마크업으로 둔다 — 리액트가 그리면 번들 로드 전까지 빈
         화면이 잠깐 보인다. 사라지는 타이밍은 src/styles/splash.css의 애니메이션이
         잡고, src/splash.ts는 다 끝난 노드를 치우는 일과 page load 대기만 맡는다.
         앱 이름은 브랜드 이미지에 이미 들어 있어 .name은 두지 않는다. -->
    <div id="splash">
      <img class="logo" src="/visual-reset/main/be-a-googler-brand.png" alt="Be a Googler" />
      <div class="stagline">배움이 모험이 되는 곳 ✨</div>
      <span class="sbar"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
